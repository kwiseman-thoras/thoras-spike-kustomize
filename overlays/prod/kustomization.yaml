apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kust-test
resources:
  - ../../base/checkout-api
  - ../../base/cart-worker
components:
  - ../../components/high-availability
replicas:
  - name: cart-worker
    count: 4
  - name: checkout-api
    count: 3
patches:
  - path: patches/checkout-api-resources.yaml
  - path: patches/cart-worker-pdb.json6902.yaml
    target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: cart-worker
