apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: checkout-api
          image: registry.k8s.io/pause:3.10
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m   # base default; prod overrides in overlays/prod/patches
              memory: 16Mi
